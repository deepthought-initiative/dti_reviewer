name: Docs

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Build docs
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload built docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          if-no-files-found: error
          path: docs/_build/html

  publish:
    needs: build
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download built docs
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: ${{ runner.temp }}/docs-artifact

      - name: Set destination directory
        if: needs.build.result == 'success'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [[ -n "$PR_NUMBER" ]]; then
            echo "DEST_DIR=pull/$PR_NUMBER" >> "$GITHUB_ENV"
          elif [[ "$BRANCH" == "$DEFAULT_BRANCH" ]]; then
            echo "DEST_DIR=" >> "$GITHUB_ENV"
          else
            echo "DEST_DIR=branch/$BRANCH" >> "$GITHUB_ENV"
          fi

      - name: Deploy docs
        id: deploy
        if: needs.build.result == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ${{ runner.temp }}/docs-artifact
          destination_dir: ${{ env.DEST_DIR }}
          keep_files: true

      - name: Find the preview comment
        id: comment
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: '<!-- dti-reviewer:docs-preview -->'

      - name: Update the preview comment
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- dti-reviewer:docs-preview -->

            Documentation build: **${{ needs.build.result }}**
            Preview deployment: **${{ steps.deploy.outcome }}**
            Revision: `${{ github.event.pull_request.head.sha }}`

            ${{ steps.deploy.outcome == 'success' && format('[View API documentation](https://{0}.github.io/{1}/pull/{2}/)', github.repository_owner, github.event.repository.name, github.event.pull_request.number) || 'No preview was published for this revision.' }}

            [Workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
