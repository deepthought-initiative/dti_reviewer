name: Publish docs preview

on:
  workflow_run:
    workflows: [Docs]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: docs-preview-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Find the current pull request
        id: pr
        uses: juliangruber/find-pull-request-action@v1
        with:
          github-token: ${{ github.token }}
          branch: ${{ github.event.workflow_run.head_repository.owner.login }}:${{ github.event.workflow_run.head_branch }}
          state: open

      - name: Check that the build matches the current PR revision
        id: current
        if: steps.pr.outputs.matching-pr-count == '1' && steps.pr.outputs.head-sha == github.event.workflow_run.head_sha
        run: echo "matched=true" >> "$GITHUB_OUTPUT"

      - name: Download built documentation
        if: steps.current.outputs.matched == 'true' && github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: docs-html
          path: ${{ runner.temp }}/docs-artifact

      - name: Deploy PR preview
        id: deploy
        if: steps.current.outputs.matched == 'true' && github.event.workflow_run.conclusion == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ${{ runner.temp }}/docs-artifact
          destination_dir: pull/${{ steps.pr.outputs.number }}
          keep_files: true

      - name: Find the preview comment
        id: comment
        if: always() && steps.current.outputs.matched == 'true'
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: github-actions[bot]
          body-includes: '<!-- dti-reviewer:docs-preview -->'

      - name: Update the preview comment
        if: always() && steps.current.outputs.matched == 'true'
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-id: ${{ steps.comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- dti-reviewer:docs-preview -->

            Documentation build: **${{ github.event.workflow_run.conclusion }}**
            Preview deployment: **${{ steps.deploy.outcome }}**
            Revision: `${{ github.event.workflow_run.head_sha }}`

            ${{ steps.deploy.outcome == 'success' && format('[View API documentation](https://{0}.github.io/{1}/pull/{2}/)', github.repository_owner, github.event.repository.name, steps.pr.outputs.number) || 'No preview was published for this revision.' }}

            [Build logs](${{ github.event.workflow_run.html_url }}) · [Publishing logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
