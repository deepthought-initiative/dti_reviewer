services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dti_reviewer-backend:latest
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY to a persistent random secret}
      - AUTH_MODE=${AUTH_MODE:-local}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_METADATA_URL=${OIDC_METADATA_URL:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - ADS_UNIFIED_DIR=/app/expert-data/NASA_ADS_UNIFIED
      - EMBEDDINGS_DIR=/app/expert-data/NASA_ADS_UNIFIED_EMBEDDINGS_REFEREED
      - VECTORIZER_PATH=/app/expert-data/tfidf_vectorizer.joblib
    volumes:
      - reviewer-db:/app/instance
      - ${ADS_UNIFIED_DIR}:/app/expert-data/NASA_ADS_UNIFIED:ro
      - ${EMBEDDINGS_DIR}:/app/expert-data/NASA_ADS_UNIFIED_EMBEDDINGS_REFEREED:ro
      - ${VECTORIZER_PATH}:/app/expert-data/tfidf_vectorizer.joblib:ro
    # ports:
    #   - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: dti_reviewer-backend:latest
    entrypoint: []
    command: conda run --no-capture-output -n dti_reviewer celery -A celery_app worker --loglevel=info --concurrency=1
    volumes:
      - ${ADS_UNIFIED_DIR}:/app/expert-data/NASA_ADS_UNIFIED:ro
      - ${EMBEDDINGS_DIR}:/app/expert-data/NASA_ADS_UNIFIED_EMBEDDINGS_REFEREED:ro
      - ${VECTORIZER_PATH}:/app/expert-data/tfidf_vectorizer.joblib:ro
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ADS_UNIFIED_DIR=/app/expert-data/NASA_ADS_UNIFIED
      - EMBEDDINGS_DIR=/app/expert-data/NASA_ADS_UNIFIED_EMBEDDINGS_REFEREED
      - VECTORIZER_PATH=/app/expert-data/tfidf_vectorizer.joblib
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: dti_reviewer-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  reviewer-db:
